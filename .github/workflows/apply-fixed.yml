name: Apply prepared festival fixes

on:
  push:
    branches:
      - chatgpt/final-client-fixes-20260809
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chatgpt/final-client-fixes-20260809' || github.ref_name == 'chatgpt/final-client-fixes-20260809'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/final-client-fixes-20260809
          fetch-depth: 0

      - name: Reconstruct and validate patch
        shell: bash
        run: |
          set -euo pipefail
          echo 'Patch chunk checksums:'
          for f in .github/fullpatch/part-*; do wc -c "$f"; sha256sum "$f"; done
          cat .github/fullpatch/part-* > /tmp/final-fixes.b64
          echo 'Combined patch payload:'
          wc -c /tmp/final-fixes.b64
          sha256sum /tmp/final-fixes.b64
          base64 --decode /tmp/final-fixes.b64 | gzip -dc > /tmp/final-fixes.patch
          sha256sum /tmp/final-fixes.patch
          git apply --check --binary /tmp/final-fixes.patch

      - name: Apply final project changes
        shell: bash
        run: |
          set -euo pipefail
          git apply --binary /tmp/final-fixes.patch
          rm -rf .github/fullpatch .github/patch
          rm -f .github/workflows/apply-fixed.yml

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit applied changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply final festival client fixes"
          git push origin HEAD:chatgpt/final-client-fixes-20260809
