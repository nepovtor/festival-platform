name: Apply ChatGPT festival fixes

on:
  push:
    branches:
      - chatgpt/festival-final-fixes-20260809
    paths:
      - .chatgpt/READY

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply archived changes
        shell: bash
        run: |
          set -euo pipefail
          cat .chatgpt/chunk_* > /tmp/festival-changes.b64
          base64 -d /tmp/festival-changes.b64 > /tmp/festival-changes.tar.xz
          tar -xJf /tmp/festival-changes.tar.xz -C .
          rm -rf .chatgpt
          rm -f .github/workflows/apply-chatgpt-fixes.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply final festival design and functionality fixes"
          git push origin HEAD:chatgpt/festival-final-fixes-20260809
